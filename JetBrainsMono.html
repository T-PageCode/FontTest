<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>FontTest</title>
    <style>
        body{
            background-color: rgb(50,50,50);
            user-select: none;
        }
        *{
            font-weight: 200;
            text-align: center;
            font-family: "JetBrains Mono";
            color: white;
        }
        button{
            width: 150px;
            height: 35px;
            background-color: rgb(0,100,255);
            border: none;
            border-radius: 10px;
            transition: background-color 0.5s ease;
        }
        button:hover{
            background-color: rgb(0,50,255);
        }
        button:active{
            background-color: rgb(0,00,255);
        }
    </style>
</head>
<body>
    <h1>JetBrains Mono</h1>
    <p>这个字体Very Good</p>
    <p>这个字体在TraeCode里是默认字体,但是他不预装在Windows里,需要从官网手动下载TTF文件并安装</p>
    <p>编程字体界的真神!</p>
    <button onclick="window.location.href='./index.html'">返回主页</button>
    <script>
        document.addEventListener("contextmenu",(e) => {
            e.preventDefault();
        })
    </script>
</body>
</html>
